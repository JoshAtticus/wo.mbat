name: Build iOS IPA (TrollStore)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-ios-ipa:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build unsigned iOS app
        run: |
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -sdk iphoneos \
            -arch arm64 \
            -derivedDataPath build/ios \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned IPA for TrollStore
        run: |
          mkdir -p build/ipa/Payload
          cp -R build/ios/Build/Products/Release-iphoneos/wo.mbat.app build/ipa/Payload/
          cd build/ipa
          zip -r -y ../wo.mbat-ios.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: wo.mbat-ios-ipa
          path: build/wo.mbat-ios.ipa
